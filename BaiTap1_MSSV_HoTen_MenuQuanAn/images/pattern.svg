<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="coffee-pattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <!-- Coffee bean shapes -->
      <g opacity="0.03">
        <ellipse cx="10" cy="10" rx="6" ry="9" fill="#4A2C20" transform="rotate(-30 10 10)"/>
        <ellipse cx="35" cy="25" rx="5" ry="7" fill="#4A2C20" transform="rotate(20 35 25)"/>
        <ellipse cx="15" cy="40" rx="6" ry="8" fill="#4A2C20" transform="rotate(-15 15 40)"/>
        <ellipse cx="40" cy="10" rx="5" ry="7" fill="#4A2C20" transform="rotate(45 40 10)"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#coffee-pattern)"/>
</svg>