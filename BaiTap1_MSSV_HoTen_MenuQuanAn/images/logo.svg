<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <g id="logo-group">
    <!-- Coffee Bean Icon -->
    <g id="coffee-bean">
      <ellipse cx="30" cy="30" rx="14" ry="20" fill="#4A2C20" transform="rotate(-20 30 30)"/>
      <path d="M26 18 Q30 30 26 42" stroke="#714A32" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    
    <!-- Brand Text -->
    <g id="brand-text">
      <text x="55" y="28" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" fill="#4A2C20" letter-spacing="2">MØC NHIÊN</text>
      <text x="55" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#C8894B" letter-spacing="4">COFFEE</text>
    </g>
    
    <!-- Decorative Line -->
    <line x1="130" y1="30" x2="150" y2="30" stroke="#D6A45D" stroke-width="1"/>
    <circle cx="155" cy="30" r="2" fill="#D6A45D"/>
  </g>
</svg>